<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Management System</title>

    <link rel="stylesheet" href="style.css">

    <script src="javascript.js" defer></script>
</head>

<body>

    <header>
        <h1>Food Management System</h1>
        <p>This system will allow students to buy food items.</p>
    </header>

    <main>

        <!-- Available Food Items -->
        <section>
            <h2>Available Food Items</h2>
            <div id="food-container" class="food-container"></div>
        </section>

        <!-- Shopping Cart -->
        <section class="cart-section">
            <h2>My Shopping Cart</h2>

            <div id="cart-container">
                <p>Your cart is empty.</p>
            </div>

            <h3>Total: <span id="total">0 RWF</span></h3>

            <button id="checkout-btn">Place Order</button>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Food Management System</p>
    </footer>

</body>
</html>
